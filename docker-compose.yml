services:
  conwo:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # ⚠️  CRITICAL — these directories contain live runtime data.
      # raw/ holds SQLite databases (Jira tickets, conversations, traces, auth).
      # wiki/ holds the AI-maintained markdown knowledge base.
      # Never run this container without these mounts — data is lost on restart.
      - ./raw:/opt/conwo/raw
      - ./wiki:/opt/conwo/wiki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
